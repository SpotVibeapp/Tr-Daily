name: tr_daily
description: >-
  Tr-Daily — an automated day-trading assistant. Scans watchlists with proven
  chart-trend analysis (indicators, support/resistance, pattern structure),
  scores setups with an ensemble + online-ML model, manages risk, and executes
  trades through a pluggable broker (Alpaca paper/live). Paper mode by default.
publish_to: "none"
version: 0.1.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP for broker + market-data REST APIs. Long-stable 1.x line.
  http: ^1.2.0
  # Simple key/value config persistence (API key ids, watchlist, risk params).
  shared_preferences: ^2.2.3
  # JSON-file persistence for trade log / equity curve on-device.
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sample_data/
