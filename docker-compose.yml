version: '3.8'

services:
  tr-daily:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tr_daily_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Operating mode: 'paper' (safe simulation) or 'live' (real money)
      - TR_BROKER_MODE=paper
      # Alpaca API Credentials (get free keys from alpaca.markets)
      - ALPACA_KEY_ID=${ALPACA_KEY_ID:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
      # Watchlist (comma-separated stock tickers)
      - WATCHLIST=AAPL,NVDA,TSLA,MSFT,AMZN
      # Engine scan cadence in seconds
      - SCAN_INTERVAL_SECONDS=60
      # Risk management parameters
      - RISK_PER_TRADE_PCT=0.5
      - MAX_DAILY_LOSS_PCT=2.0
      - MAX_OPEN_POSITIONS=1
      # Skip new trades under $1 a share or under ~$1M traded per session
      - MIN_SHARE_PRICE=1.0
      - MIN_DOLLAR_VOLUME=1000000
      # Free phone push notifications (Discord webhook or Telegram bot)
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Healthcheck web port
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
