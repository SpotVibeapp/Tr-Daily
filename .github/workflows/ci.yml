name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze-and-test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  compile-check:
    name: full compile check (web)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform folders
        # Repo ships lib-only (see README); generate platform targets for build.
        run: flutter create --project-name tr_daily --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --no-tree-shake-icons
