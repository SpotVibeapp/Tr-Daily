name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-and-test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Outputs are echoed into the job summary so failures are readable
      # even when raw logs are inaccessible.
      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          st=${PIPESTATUS[0]}
          {
            echo "## flutter analyze — exit $st"
            echo '```'
            tail -c 120000 analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $st

      - name: Test
        if: always()
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee test.log
          st=${PIPESTATUS[0]}
          {
            echo "## flutter test — exit $st"
            echo '```'
            tail -c 120000 test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $st

      # Publish results as a PR comment — job summaries/logs require an
      # authenticated browser session, this keeps failures machine-readable.
      - name: Publish CI report to PR
        if: always()
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          touch analyze.log test.log
          A_EXIT="ok"; T_EXIT="ok"
          grep -q "exit 0" analyze.log 2>/dev/null || A_EXIT="see below"
          body_file=$(mktemp)
          {
            echo "<!-- trdaily-ci-report -->"
            echo "## 🤖 CI report (run ${{ github.run_id }})"
            echo
            echo '### flutter analyze'
            echo '```'
            tail -c 25000 analyze.log
            echo '```'
            echo '### flutter test'
            echo '```'
            tail -c 35000 test.log
            echo '```'
          } > "$body_file"
          existing=$(gh api "repos/\${{ github.repository }}/issues/1/comments" \
            --jq '[.[] | select(.body | contains("<!-- trdaily-ci-report -->"))][0].id // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/\${{ github.repository }}/issues/comments/$existing" \
              -f body@"$body_file" > /dev/null
          else
            gh api -X POST "repos/\${{ github.repository }}/issues/1/comments" \
              -f body@"$body_file" > /dev/null
          fi
          echo "report published"

  compile-check:
    name: full compile check (web)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform folders
        # Repo ships lib-only (see README); generate platform targets for build.
        run: flutter create --project-name tr_daily --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        shell: bash
        run: |
          set +e
          flutter build web --no-tree-shake-icons 2>&1 | tee build.log
          st=${PIPESTATUS[0]}
          {
            echo "## flutter build web — exit $st"
            echo '```'
            tail -c 120000 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $st
