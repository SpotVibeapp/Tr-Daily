# Conservative analyzer config — no external lint packages, so
# `flutter analyze` never fails on a missing include.
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    # Flow analysis already guarantees these null checks in context; the
    # redundant `!`s are harmless and blanket-removing them is risky.
    unnecessary_non_null_assertion: ignore
    # `withOpacity` / `DropdownButtonFormField.value` are deprecated but
    # still work on every Flutter version we support — the replacements
    # (withValues/initialValue) don't exist on older stable releases the
    # user may have locally. Real API removals still surface as errors.
    deprecated_member_use: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_shadowing_type_parameters
    - avoid_types_as_parameter_names
    - await_only_futures
    - cancel_subscriptions
    - close_sinks
    - control_flow_in_finally
    - empty_catches
    - empty_constructor_bodies
    - empty_statements
    - hash_and_equals
    - no_duplicate_case_values
    - no_leading_underscores_for_local_identifiers
    - non_constant_identifier_names
    - prefer_final_fields
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_iterable_whereType
    - unnecessary_brace_in_string_interps
    - unnecessary_const
    - unnecessary_getters_setters
    - unnecessary_new
    - unnecessary_this
    - unrelated_type_equality_checks
    - use_rethrow_when_possible
    - valid_regexps
